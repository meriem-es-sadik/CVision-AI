<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CVision AI - AI CV Analyzer & Smart Job Matcher. Upload your resume, get AI-powered analysis and matched jobs."
    />
    <title>CVision AI - AI CV Analyzer &amp; Smart Job Matcher</title>
    <script>
      // Applied before first paint so the correct theme is rendered without a flash.
      (function () {
        try {
          var storageKey = 'cvision-ai-theme'
          var stored = window.localStorage.getItem(storageKey)
          var theme = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system'
          var resolved =
            theme === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : theme

          var root = document.documentElement
          root.classList.toggle('dark', resolved === 'dark')
          root.style.colorScheme = resolved
        } catch (error) {
          /* localStorage unavailable - fall back to the light theme */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
